<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>可爱日常记账本</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #fff4f8, #eef7ff);
      color: #444;
      padding: 30px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 34px;
      color: #ff8fab;
      margin-bottom: 8px;
    }

    .header p {
      color: #888;
      font-size: 15px;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(255, 143, 171, 0.15);
      margin-bottom: 24px;
    }

    .form-title {
      font-size: 22px;
      color: #ff8fab;
      margin-bottom: 18px;
    }

    .form {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }

    input,
    select,
    button {
      border: none;
      outline: none;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px;
    }

    input,
    select {
      background: #fff6f9;
      color: #555;
    }

    input::placeholder {
      color: #bbb;
    }

    button {
      background: #ffb3c6;
      color: white;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    button:hover {
      background: #ff8fab;
      transform: translateY(-2px);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .summary-card {
      border-radius: 22px;
      padding: 22px;
      text-align: center;
      background: #fff;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.05);
    }

    .summary-card h3 {
      font-size: 17px;
      margin-bottom: 10px;
    }

    .summary-card .money {
      font-size: 26px;
      font-weight: bold;
    }

    .eat {
      background: #fff0f3;
      color: #ff7a9c;
    }

    .travel {
      background: #eef7ff;
      color: #5da9e9;
    }

    .use {
      background: #f3f0ff;
      color: #8b7cf6;
    }

    .total-card {
      background: linear-gradient(135deg, #ffcad4, #bde0fe);
      color: white;
      text-align: center;
      border-radius: 24px;
      padding: 26px;
      margin-bottom: 24px;
    }

    .total-card h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .total-card .total-money {
      font-size: 38px;
      font-weight: bold;
    }

    .online-offline {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      margin-top: 18px;
    }

    .small-card {
      background: #fff;
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.05);
    }

    .small-card h3 {
      margin-bottom: 8px;
      color: #777;
    }

    .small-card div {
      font-size: 24px;
      font-weight: bold;
      color: #ff8fab;
    }

    .list-title {
      font-size: 22px;
      color: #ff8fab;
      margin-bottom: 16px;
    }

    .record-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .record-item {
      background: #fff8fb;
      border-radius: 18px;
      padding: 14px 18px;
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr 1fr auto;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .tag {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 13px;
      color: white;
      text-align: center;
    }

    .tag-eat {
      background: #ff8fab;
    }

    .tag-travel {
      background: #74c0fc;
    }

    .tag-use {
      background: #a78bfa;
    }

    .type {
      color: #777;
    }

    .amount {
      font-weight: bold;
      color: #ff6b8b;
    }

    .delete-btn {
      background: #ffd6e0;
      color: #ff5c8a;
      padding: 8px 12px;
      font-size: 13px;
    }

    .empty {
      text-align: center;
      color: #aaa;
      padding: 30px 0;
    }

    @media (max-width: 768px) {
      body {
        padding: 18px;
      }

      .form {
        grid-template-columns: 1fr;
      }

      .summary,
      .online-offline {
        grid-template-columns: 1fr;
      }

      .record-item {
        grid-template-columns: 1fr;
        gap: 6px;
      }
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="header">
      <h1>🌸 日常记账本</h1>
      <p>记录每一笔小花销，让生活可爱又清楚</p>
    </div>

    <div class="card">
      <h2 class="form-title">添加一笔消费</h2>

      <div class="form">
        <input id="nameInput" type="text" placeholder="消费名称，如奶茶" />

        <input id="amountInput" type="number" placeholder="金额" />

        <select id="categoryInput">
          <option value="吃">吃</option>
          <option value="行">行</option>
          <option value="用">用</option>
        </select>

        <select id="typeInput">
          <option value="线上">线上</option>
          <option value="线下">线下</option>
        </select>

        <button onclick="addRecord()">添加</button>
      </div>
    </div>

    <div class="total-card">
      <h2>总花销</h2>
      <div class="total-money">￥<span id="totalAmount">0.00</span></div>
    </div>

    <div class="summary">
      <div class="summary-card eat">
        <h3>🍚 吃</h3>
        <div class="money">￥<span id="eatTotal">0.00</span></div>
      </div>

      <div class="summary-card travel">
        <h3>🚗 行</h3>
        <div class="money">￥<span id="travelTotal">0.00</span></div>
      </div>

      <div class="summary-card use">
        <h3>🛍 用</h3>
        <div class="money">￥<span id="useTotal">0.00</span></div>
      </div>
    </div>

    <div class="online-offline">
      <div class="small-card">
        <h3>💻 线上花销</h3>
        <div>￥<span id="onlineTotal">0.00</span></div>
      </div>

      <div class="small-card">
        <h3>🏪 线下花销</h3>
        <div>￥<span id="offlineTotal">0.00</span></div>
      </div>
    </div>

    <div class="card" style="margin-top: 24px;">
      <h2 class="list-title">消费记录</h2>
      <div id="recordList" class="record-list">
        <div class="empty">还没有记录，快添加第一笔吧～</div>
      </div>
    </div>

  </div>

  <script>
    let records = [];

    function addRecord() {
      const name = document.getElementById("nameInput").value.trim();
      const amount = Number(document.getElementById("amountInput").value);
      const category = document.getElementById("categoryInput").value;
      const type = document.getElementById("typeInput").value;

      if (!name) {
        alert("请输入消费名称哦～");
        return;
      }

      if (!amount || amount <= 0) {
        alert("请输入正确的金额哦～");
        return;
      }

      const record = {
        id: Date.now(),
        name,
        amount,
        category,
        type
      };

      records.push(record);

      document.getElementById("nameInput").value = "";
      document.getElementById("amountInput").value = "";

      render();
    }

    function deleteRecord(id) {
      records = records.filter(item => item.id !== id);
      render();
    }

    function render() {
      renderList();
      renderSummary();
    }

    function renderList() {
      const recordList = document.getElementById("recordList");

      if (records.length === 0) {
        recordList.innerHTML = `<div class="empty">还没有记录，快添加第一笔吧～</div>`;
        return;
      }

      recordList.innerHTML = records.map(item => {
        let tagClass = "";

        if (item.category === "吃") {
          tagClass = "tag-eat";
        } else if (item.category === "行") {
          tagClass = "tag-travel";
        } else {
          tagClass = "tag-use";
        }

        return `
          <div class="record-item">
            <div>${item.name}</div>
            <div>
              <span class="tag ${tagClass}">${item.category}</span>
            </div>
            <div class="type">${item.type}</div>
            <div class="amount">￥${item.amount.toFixed(2)}</div>
            <button class="delete-btn" onclick="deleteRecord(${item.id})">删除</button>
          </div>
        `;
      }).join("");
    }

    function renderSummary() {
      const total = records.reduce((sum, item) => sum + item.amount, 0);

      const eatTotal = records
        .filter(item => item.category === "吃")
        .reduce((sum, item) => sum + item.amount, 0);

      const travelTotal = records
        .filter(item => item.category === "行")
        .reduce((sum, item) => sum + item.amount, 0);

      const useTotal = records
        .filter(item => item.category === "用")
        .reduce((sum, item) => sum + item.amount, 0);

      const onlineTotal = records
        .filter(item => item.type === "线上")
        .reduce((sum, item) => sum + item.amount, 0);

      const offlineTotal = records
        .filter(item => item.type === "线下")
        .reduce((sum, item) => sum + item.amount, 0);

      document.getElementById("totalAmount").innerText = total.toFixed(2);
      document.getElementById("eatTotal").innerText = eatTotal.toFixed(2);
      document.getElementById("travelTotal").innerText = travelTotal.toFixed(2);
      document.getElementById("useTotal").innerText = useTotal.toFixed(2);
      document.getElementById("onlineTotal").innerText = onlineTotal.toFixed(2);
      document.getElementById("offlineTotal").innerText = offlineTotal.toFixed(2);
    }
  </script>
</body>
</html>
